<style>
  /* ============================================================
     Capim Design System — foundation
     Fonte: capim-ds-mcp (foundation.tokens.json + componentes + logos)
     Marca: roxo #59399e + lima #d9f363 · ink #201f26
     Tipografia: Red Hat Display (títulos) · Roboto (texto)
     ============================================================ */
  :root {
    /* Marca — Roxo (primário) */
    --c-purple-900: #221540; --c-purple-800: #32205f; --c-purple-700: #3a2666;
    --c-purple-600: #59399e; --c-purple-300: #ab9de8; --c-purple-100: #eeecfb;
    /* Marca — Lima (acento) */
    --c-lime-600: #a6cd15; --c-lime-500: #bee41e; --c-lime-400: #d9f363;
    --c-lime-100: #f5fccb; --c-lime-ink: #33400f;
    /* Neutros / ink */
    --c-ink: #201f26; --c-ink-2: #444152; --c-muted: #79778c; --c-disabled: #bbb8cc;
    --c-border: #e9e9f2; --c-surface: #f5f5fa; --c-white: #ffffff;
    /* Status */
    --c-info: #3de4f5; --c-success: #119538; --c-danger: #dd3c3c;
    /* Tipografia */
    --font-heading: "Red Hat Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-body: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    /* Raio */
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px;
    /* Sombra (DS Nível 1 / 2 / 3) */
    --shadow-1: 0px 1px 4px 0px rgba(145,144,160,.08);
    --shadow-2: 0px 4px 12px 0px rgba(145,144,160,.08);
    --shadow-3: 0px 8px 32px 0px rgba(32,31,38,.2);
    /* Aliases semânticos da app */
    --bg: var(--c-surface); --card: var(--c-white); --ink: var(--c-ink);
    --muted: var(--c-muted); --border: var(--c-border);
    --primary: var(--c-purple-600); --primary-dark: var(--c-purple-700);
    --primary-soft: var(--c-purple-100);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: linear-gradient(135deg, var(--c-purple-600) 0%, var(--c-purple-800) 100%);
    color: #fff;
    padding: 44px 24px 40px;
    position: relative;
  }
  header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
    background: linear-gradient(90deg, var(--c-lime-400), var(--c-lime-500));
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .brand-logo { height: 38px; width: auto; display: block; margin-bottom: 22px; }
  header h1 {
    font-family: var(--font-heading); font-weight: 900;
    margin: 0 0 10px; font-size: 40px; line-height: 1.05; letter-spacing: -.5px;
  }
  header p { margin: 0; opacity: .9; font-size: 16px; max-width: 640px; line-height: 1.55; }
  .header-badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(217,243,99,.16); color: var(--c-lime-400);
    padding: 5px 13px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 700;
    margin-bottom: 16px; border: 1px solid rgba(217,243,99,.32);
  }
  .header-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c-lime-400); }
  .controls {
    position: sticky; top: 0; z-index: 20;
    background: rgba(245,245,250,.9); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }
  .controls-inner { max-width: 1180px; margin: 0 auto; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  #search {
    flex: 1; min-width: 220px;
    padding: 11px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-family: var(--font-body); font-size: 15px; background: #fff; color: var(--ink);
  }
  #search::placeholder { color: var(--c-disabled); }
  #search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-family: var(--font-body);
    border: 1px solid var(--border); background: #fff; color: var(--muted);
    padding: 8px 14px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .15s ease; white-space: nowrap;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }
  .area-section { margin-bottom: 44px; scroll-margin-top: 90px; }
  .area-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 18px; }
  .area-head h2 { font-family: var(--font-heading); font-weight: 800; margin: 0; font-size: 24px; letter-spacing: -.3px; color: var(--c-ink); }
  .area-count { color: var(--muted); font-size: 14px; font-weight: 600; }
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 22px; box-shadow: var(--shadow-1); display: flex; flex-direction: column;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); border-color: var(--c-purple-300); }
  .card h3 { font-family: var(--font-heading); font-weight: 800; margin: 0 0 6px; font-size: 18px; letter-spacing: -.2px; color: var(--c-ink); }
  .owner { color: var(--primary); font-size: 13px; font-weight: 700; margin: 0 0 14px; display: flex; align-items: center; gap: 6px; }
  .owner svg { flex: none; }
  .desc { color: var(--c-ink-2); font-size: 14.5px; line-height: 1.55; margin: 0 0 18px; flex: 1; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font-family: var(--font-body); font-size: 13px; font-weight: 700; padding: 9px 15px; border-radius: var(--radius-sm);
    transition: all .15s ease; border: 1px solid transparent;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-ghost { background: var(--primary-soft); color: var(--primary); }
  .btn-ghost:hover { background: #e2dcf7; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 16px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 32px 24px 48px; }
  footer strong { color: var(--c-ink-2); font-weight: 700; }
  .tag { display: inline-block; align-self: flex-start; font-family: var(--font-body); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
    color: var(--primary); background: var(--primary-soft); padding: 3px 9px; border-radius: 6px; margin-bottom: 12px; }
</style>
</head>

  { name: "Cockpit ClinicIQ", owner: "Robson Manoel", area: "Dados & Analytics",
    desc: "Análise de churn/retenção de clínicas por perfil de uso. LLM orquestra narrativa e roteamento com fallback, sobre skills plugáveis.",
    deck: "https://drive.google.com/drive/folders/11b4rKZIA2uenoGIHBMWjnPS6P1E8DIhW" },
  { name: "Metabase Toolkit (README)", owner: "Daniel Gurgel", area: "Dados & Analytics",
    desc: "Toolkit de Metabase operável via MCP por linguagem natural (prepare→commit), com dependency graph e impact analysis. Milhares de cards.",
    deck: "https://drive.google.com/file/d/1LthPF1ZoOblNHD0Df7OytSNfpo0hWs26/view",
    video: "https://drive.google.com/file/d/1txAaPVMiBt_FWegvS2lPQyeWdXiVIOoA/view" },

  // ── Produto ──
  { name: "Radar de Oportunidades (README)", owner: "Giovanna Ambrozio", area: "Produto",
    desc: "Discovery e síntese multi-fonte de oportunidades, com agentes por fonte e mecanismo anti-alucinação.",
    deck: "https://drive.google.com/file/d/1-0XzEAnoER41tq8PB6qgk2G2k7fZhP6S/view",
    video: "https://drive.google.com/file/d/1TQzJHHy28ejT31uM6yy7XxgpB3lDYme2/view" },
];

const AREA_ORDER = [
  "Engenharia",
  "Riscos & Crédito",
  "Customer Success",
  "Finanças",
  "Comercial & Marketing",
  "Dados & Analytics",
  "Produto",
];

const userIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
const playIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>';

let activeArea = "all";
let query = "";

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render() {
  const catalog = document.getElementById("catalog");
  const q = query.trim().toLowerCase();
  let total = 0;
  let html = "";

  for (const area of AREA_ORDER) {
    if (activeArea !== "all" && activeArea !== area) continue;
    const items = APPS.filter(a => a.area === area).filter(a => {
      if (!q) return true;
      return (a.name + " " + a.owner + " " + a.desc).toLowerCase().includes(q);
    });
    if (!items.length) continue;
    total += items.length;

    html += `<section class="area-section">
      <div class="area-head"><h2>${escapeHtml(area)}</h2><span class="area-count">${items.length} app${items.length>1?'s':''}</span></div>
      <div class="grid">`;
    for (const a of items) {
      let links = `<a class="btn btn-primary" href="${a.deck}" target="_blank" rel="noopener">${linkIcon} Acessar</a>`;
      if (a.video) links += `<a class="btn btn-ghost" href="${a.video}" target="_blank" rel="noopener">${playIcon} Vídeo</a>`;
      html += `<article class="card">
        <span class="tag">${escapeHtml(a.area)}</span>
        <h3>${escapeHtml(a.name)}</h3>
        <p class="owner">${userIcon} ${escapeHtml(a.owner)}</p>
        <p class="desc">${escapeHtml(a.desc)}</p>
        <div class="links">${links}</div>
      </article>`;
    }
    html += `</div></section>`;
  }

  catalog.innerHTML = total ? html : `<div class="empty">Nenhum app encontrado para "<strong>${escapeHtml(query)}</strong>".</div>`;
  document.getElementById("footer-count").textContent = `${APPS.length} apps em ${AREA_ORDER.length} áreas`;
}

function buildFilters() {
  const el = document.getElementById("filters");
  const mk = (label, val) => `<button class="chip${val===activeArea?' active':''}" data-area="${val}">${label}</button>`;
  el.innerHTML = mk("Todas", "all") + AREA_ORDER.map(a => mk(a, a)).join("");
  el.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    activeArea = c.dataset.area;
    buildFilters(); render();
  }));
}

document.getElementById("search").addEventListener("input", e => { query = e.target.value; render(); });
buildFilters();
render();
</script>
</body>
</html>
