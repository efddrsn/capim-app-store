<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capim App Store — Catálogo de Apps</title>
<style>
  :root {
    --green: #00a868;
    --green-dark: #00875a;
    --green-soft: #e6f7f0;
    --ink: #0f2a22;
    --muted: #5b7068;
    --bg: #f4f8f6;
    --card: #ffffff;
    --border: #e2ebe7;
    --shadow: 0 1px 2px rgba(15,42,34,.06), 0 8px 24px rgba(15,42,34,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
    color: #fff;
    padding: 48px 24px 40px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: -.5px; }
  header p { margin: 0; opacity: .92; font-size: 16px; max-width: 640px; line-height: 1.5; }
  .header-badge {
    display: inline-block; background: rgba(255,255,255,.18);
    padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
    margin-bottom: 16px; backdrop-filter: blur(4px);
  }
  .controls {
    position: sticky; top: 0; z-index: 20;
    background: rgba(244,248,246,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }
  .controls-inner { max-width: 1180px; margin: 0 auto; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  #search {
    flex: 1; min-width: 220px;
    padding: 11px 16px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 15px; background: #fff; color: var(--ink);
  }
  #search:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: #fff; color: var(--muted);
    padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s ease; white-space: nowrap;
  }
  .chip:hover { border-color: var(--green); color: var(--green-dark); }
  .chip.active { background: var(--green); border-color: var(--green); color: #fff; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }
  .area-section { margin-bottom: 44px; scroll-margin-top: 90px; }
  .area-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 18px; }
  .area-head h2 { margin: 0; font-size: 22px; letter-spacing: -.3px; }
  .area-count { color: var(--muted); font-size: 14px; font-weight: 600; }
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 4px 8px rgba(15,42,34,.08), 0 18px 40px rgba(15,42,34,.12); }
  .card h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: -.2px; }
  .owner { color: var(--green-dark); font-size: 13px; font-weight: 600; margin: 0 0 14px; display: flex; align-items: center; gap: 6px; }
  .owner svg { flex: none; }
  .desc { color: var(--muted); font-size: 14.5px; line-height: 1.55; margin: 0 0 18px; flex: 1; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 9px;
    transition: all .15s ease;
  }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-ghost { background: var(--green-soft); color: var(--green-dark); }
  .btn-ghost:hover { background: #d4f0e3; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 16px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 32px 24px 48px; }
  .tag { display:inline-block; font-size: 11px; font-weight:700; text-transform: uppercase; letter-spacing:.4px;
    color: var(--green-dark); background: var(--green-soft); padding: 3px 9px; border-radius: 6px; margin-bottom: 12px; }
</style>
</head>

  <div class="wrap">

  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <input id="search" type="search" placeholder="Buscar por app, responsável ou descrição…" autocomplete="off" />
    <div class="filters" id="filters"></div>
  </div>
</div>

<main id="catalog"></main>

<footer>
  <span id="footer-count"></span> · Capim App Store
</footer>

const AREA_ORDER = [
  "Engenharia",
  "Riscos & Crédito",
  "Customer Success",
  "Finanças",
  "Comercial & Marketing",
  "Dados & Analytics",
  "Produto",
];

const userIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
const playIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>';

let activeArea = "all";
let query = "";

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render() {
  const catalog = document.getElementById("catalog");
  const q = query.trim().toLowerCase();
  let total = 0;
  let html = "";

  for (const area of AREA_ORDER) {
    if (activeArea !== "all" && activeArea !== area) continue;
    const items = APPS.filter(a => a.area === area).filter(a => {
      if (!q) return true;
      return (a.name + " " + a.owner + " " + a.desc).toLowerCase().includes(q);
    });
    if (!items.length) continue;
    total += items.length;

    html += `<section class="area-section">
      <div class="area-head"><h2>${escapeHtml(area)}</h2><span class="area-count">${items.length} app${items.length>1?'s':''}</span></div>
      <div class="grid">`;
    for (const a of items) {
      let links = `<a class="btn btn-primary" href="${a.deck}" target="_blank" rel="noopener">${linkIcon} Acessar</a>`;
      if (a.video) links += `<a class="btn btn-ghost" href="${a.video}" target="_blank" rel="noopener">${playIcon} Vídeo</a>`;
      html += `<article class="card">
        <span class="tag">${escapeHtml(a.area)}</span>
        <h3>${escapeHtml(a.name)}</h3>
        <p class="owner">${userIcon} ${escapeHtml(a.owner)}</p>
        <p class="desc">${escapeHtml(a.desc)}</p>
        <div class="links">${links}</div>
      </article>`;
    }
    html += `</div></section>`;
  }

  catalog.innerHTML = total ? html : `<div class="empty">Nenhum app encontrado para "<strong>${escapeHtml(query)}</strong>".</div>`;
  document.getElementById("footer-count").textContent = `${APPS.length} apps em ${AREA_ORDER.length} áreas`;
}

function buildFilters() {
  const el = document.getElementById("filters");
  const mk = (label, val) => `<button class="chip${val===activeArea?' active':''}" data-area="${val}">${label}</button>`;
  el.innerHTML = mk("Todas", "all") + AREA_ORDER.map(a => mk(a, a)).join("");
  el.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    activeArea = c.dataset.area;
    buildFilters(); render();
  }));
}

document.getElementById("search").addEventListener("input", e => { query = e.target.value; render(); });
buildFilters();
render();
</script>
